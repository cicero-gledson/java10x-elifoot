spring:
  application:
    name: elifoot

  datasource:
    url: jdbc:postgresql://localhost:5432/elifoot
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

